<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodApp</title>
    <link rel="stylesheet" href="../style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="login-screen">
        <div class="login-box">
            <div class="brand-icon">🍔</div>
            <h2>Create account</h2>
            <p class="subtitle">Join thousands of happy food lovers</p>

            <form id="registerForm">
                <input type="text" id="reg_name" placeholder="Full Name" required>
                <input type="email" id="reg_email" placeholder="Email" required>
                <input type="password" id="reg_password" placeholder="Password" required>
                <button type="button" onclick="handleRegister()">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? 
                <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const name = document.getElementById("reg_name").value.trim();
            const email = document.getElementById("reg_email").value.trim();
            const password = document.getElementById("reg_password").value.trim();
            
            if (!name || !email || !password) {
                alert("Please fill all fields");
                return;
            }
            await registerUser(name, email, password);
        }
    </script>
</body>
</html>
